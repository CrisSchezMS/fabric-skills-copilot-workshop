name: Validate workshop

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUN_SPARK_TESTS: "1"
      SPARK_LOCAL_IP: "127.0.0.1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install local test dependencies
        run: python -m pip install -r requirements-dev.txt "pyspark<4"
      - name: Lint
        run: python -m ruff check .
      - name: Check source formatting
        run: python -m ruff format --check src tools tests
      - name: Check standalone notebooks and expected results
        run: python -m tools.build_notebooks --check
      - name: Run unit and local Spark tests
        run: python -m unittest discover -s tests -v
